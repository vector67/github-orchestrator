[project]
name = "github-orchestrator"
version = "0.1.0"
description = "Local GitHub event polling and dispatch system"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
github-orchestrator = "github_orchestrator.cli.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_orchestrator"]
artifacts = ["src/github_orchestrator/board_api/static/app/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
tmp_path_retention_policy = "failed"
addopts = ["--dist", "loadgroup"]
timeout = 60

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.0.8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "httpx2>=2.13.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
files = [
    "src",
    "tests/conftest.py",
    "tests/subprocess_recording.py",
    "tests/forked_run.py",
    "tests/disk_layout.py",
    "tests/builders.py",
    "tests/waiting.py",
    "tests/**/support.py",
    "tests/**/scripted_*.py",
]
strict = true
warn_unreachable = true
disallow_any_unimported = true
