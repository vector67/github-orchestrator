name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  tested-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag names the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          case "${GITHUB_REF_NAME#v}" in
            "$version" | "$version"-rc.*) echo "tag $GITHUB_REF_NAME releases $version" ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1 ;;
          esac

      - name: Fetch the wheel a passing pre-release run tested on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pre-release.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "no successful pre-release run on $GITHUB_SHA; run the pre-release workflow on this commit first"; exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name release --dir .
          ls dist/*.whl install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.whl
            install.sh
          if-no-files-found: error

  publish:
    needs: tested-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Read the notes from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(echo "$ref" | jq -r .object.type)" != tag ]; then
            echo "$GITHUB_REF_NAME is a lightweight tag; a release tag carries its notes, so make it with git tag -a"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" -q .message > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.whl install.sh \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

  install-the-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Give the runner a user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for second in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/systemd/private" ] && break
            sleep 1
          done

      - name: Install the published release with its own install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern install.sh
          sh install.sh -y --no-open --version "$GITHUB_REF_NAME"
          curl -fsS http://127.0.0.1:8720/api/health | tee health.json
          python3 -c 'import json; state = json.load(open("health.json"))["state"]; assert state == "setup", state'
          "$HOME/.local/bin/github-orchestrator" uninstall --yes

  update-from-previous:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Give the runner a user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for second in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/systemd/private" ] && break
            sleep 1
          done

      - name: Install the release before this one with its own install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 50 --json tagName -q '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1)
          echo "updating from $previous"
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern install.sh --output previous-install.sh
          sh previous-install.sh -y --no-open --version "$previous"

      - name: update installs the new release from GitHub
        env:
          GITHUB_ORCHESTRATOR_GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$HOME/.local/bin/github-orchestrator" update
          curl -fsS http://127.0.0.1:8720/api/health | tee health.json
          python3 -c 'import json, sys; got = json.load(open("health.json"))["version"]; assert got == sys.argv[1], f"hub runs {got}, not {sys.argv[1]}"' "${GITHUB_REF_NAME#v}"
          "$HOME/.local/bin/github-orchestrator" uninstall --yes
